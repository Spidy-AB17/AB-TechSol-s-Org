<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#040A12" />
      <stop offset="50%" stop-color="#07121F" />
      <stop offset="100%" stop-color="#0B1A2E" />
    </linearGradient>

    <!-- Cyan to Blue Brand Gradient for 'B' and Accents -->
    <linearGradient id="ogBrandGrad" x1="0" y1="0" x2="300" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="55%" stop-color="#0A84FF" />
      <stop offset="100%" stop-color="#0052CC" />
    </linearGradient>

    <linearGradient id="ogTextGrad" x1="0" y1="0" x2="500" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="50%" stop-color="#0A84FF" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="ogGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Subtle Ambient Glow -->
  <circle cx="200" cy="180" r="280" fill="#0A84FF" opacity="0.12" filter="url(#ogGlow)" />
  <circle cx="1050" cy="480" r="300" fill="#00E5FF" opacity="0.08" filter="url(#ogGlow)" />

  <!-- Geometric Grid Pattern -->
  <g opacity="0.06" stroke="#00E5FF" stroke-width="1">
    <path d="M 0,90 L 1200,90 M 0,180 L 1200,180 M 0,270 L 1200,270 M 0,360 L 1200,360 M 0,450 L 1200,450 M 0,540 L 1200,540" />
    <path d="M 120,0 L 120,630 M 240,0 L 240,630 M 360,0 L 360,630 M 480,0 L 480,630 M 600,0 L 600,630 M 720,0 L 720,630 M 840,0 L 840,630 M 960,0 L 960,630 M 1080,0 L 1080,630" />
  </g>

  <!-- Container Box with Glass Edge -->
  <rect x="60" y="50" width="1080" height="530" rx="24" fill="#0B1B2B" fill-opacity="0.45" stroke="#1E293B" stroke-width="2" />

  <!-- Left: Official Interlocking AB Monogram (Centered & Scaled) -->
  <g transform="translate(110, 150) scale(1.65)">
    <!-- Base plate -->
    <rect x="-10" y="-10" width="220" height="180" rx="20" fill="#0A1828" stroke="#1E3A5F" stroke-width="2" />
    
    <!-- Outer 'A' Facet (Cyan Left Slope) -->
    <path d="M 24,142 L 86,22 L 102,22 L 74,142 Z" fill="#00E5FF" />
    
    <!-- Inner Base Mountain / Triangle -->
    <path d="M 52,142 L 74,102 L 96,142 Z" fill="#0A84FF" />
    
    <!-- 3D Chiseled Right Facet of 'A' -->
    <path d="M 102,22 L 86,22 L 114,142 L 130,142 Z" fill="#0052CC" />

    <!-- 'B' Main Outer Body -->
    <path d="M 112,22 L 152,22 C 182,22 198,38 198,62 C 198,78 186,90 170,95 C 190,100 202,116 202,138 C 202,156 182,156 156,156 L 68,156 L 78,142 L 152,142 C 168,142 178,138 178,124 C 178,110 166,104 148,104 L 118,104 L 112,90 L 144,90 C 160,90 172,84 172,70 C 172,56 160,50 144,50 L 104,50 Z" 
          fill="url(#ogBrandGrad)" />
  </g>

  <!-- Right: Branding & Value Proposition -->
  <g transform="translate(520, 130)">
    <!-- Eyebrow Badge -->
    <rect x="0" y="0" width="380" height="34" rx="17" fill="#0A84FF" fill-opacity="0.15" stroke="#0A84FF" stroke-width="1.5" />
    <circle cx="16" cy="17" r="4" fill="#00E5FF" />
    <text x="32" y="22" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="700" fill="#00E5FF" letter-spacing="2">
      OFFICIAL DEVELOPMENT AGENCY
    </text>

    <!-- Main Brand Name -->
    <text x="0" y="105" font-family="'Outfit', system-ui, sans-serif" font-size="64" font-weight="800" fill="#FFFFFF" letter-spacing="-1">
      AB <tspan fill="url(#ogTextGrad)">TechSol</tspan>
    </text>

    <!-- Headline Tagline -->
    <text x="0" y="160" font-family="'Outfit', system-ui, sans-serif" font-size="28" font-weight="700" fill="#E2E8F0">
      Custom Website &amp; Project Development
    </text>

    <!-- Detailed Keyword-Rich Subtitle -->
    <text x="0" y="210" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="18" font-weight="400" fill="#94A3B8">
      High-performance websites, custom web applications,
    </text>
    <text x="0" y="238" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="18" font-weight="400" fill="#94A3B8">
      enterprise software, and scalable AI-powered solutions.
    </text>

    <!-- Feature Pills -->
    <g transform="translate(0, 275)">
      <rect x="0" y="0" width="160" height="38" rx="8" fill="#1E293B" stroke="#334155" />
      <text x="80" y="24" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600" fill="#F1F5F9">⚡ Sub-Second Speed</text>

      <rect x="175" y="0" width="165" height="38" rx="8" fill="#1E293B" stroke="#334155" />
      <text x="257" y="24" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600" fill="#F1F5F9">🎯 100% Custom Code</text>

      <rect x="355" y="0" width="150" height="38" rx="8" fill="#1E293B" stroke="#334155" />
      <text x="430" y="24" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600" fill="#F1F5F9">🔍 Google SEO Ready</text>
    </g>

    <!-- URL and Contact Bar -->
    <g transform="translate(0, 350)">
      <text x="0" y="20" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="600" fill="#00E5FF">
        abtechsol.com
      </text>
      <text x="160" y="20" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="500" fill="#64748B">
        • Direct: +91 88613 75377 • abtechsol660@gmail.com
      </text>
    </g>
  </g>
</svg>
